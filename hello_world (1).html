    <title>Hello World</title>
    <!-- 引入 Tailwind CSS 框架以進行快速且簡潔的樣式設定 -->

    <!-- 引入 Google Fonts 的 Inter 字體讓畫面更好看 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>

    }
</style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center m-0 p-0 selection:bg-blue-200">
