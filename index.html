<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="甜甜的每日行事曆：安排日程、記下待辦，留一點時間給自己。">
  <title>甜日誌｜每日行事曆</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #493b48;
      --muted: #927f8d;
      --pink: #e98fb0;
      --pink-dark: #ca668d;
      --pink-soft: #fff0f5;
      --lavender: #f2efff;
      --mint: #e9f7f0;
      --yellow: #fff5d8;
      --line: #f0e5eb;
      --white: rgba(255,255,255,.88);
      --shadow: 0 18px 55px rgba(151, 104, 128, .12);
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 8%, #ffe1ec 0, transparent 28%),
        radial-gradient(ellipse at 92% 12%, #e9e5ff 0, transparent 27%),
        radial-gradient(ellipse at 78% 92%, #e0f5e9 0, transparent 25%),
        #fff9fb;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1.05rem; font-weight: 800; letter-spacing: .04em; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 15px; background: var(--pink-soft); font-size: 1.35rem; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .button { min-height: 42px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
    .button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px #ce91aa24; }
    .button.primary { border-color: var(--pink); background: var(--pink); color: white; font-weight: 750; }
    .button.icon { width: 42px; padding: 0; font-size: 1.1rem; }
    .hero { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin: 24px 0; }
    .eyebrow { margin: 0 0 7px; color: var(--pink-dark); font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.55rem); letter-spacing: -.04em; }
    .today-line { margin: 8px 0 0; color: var(--muted); }
    .quote { max-width: 300px; padding: 14px 17px; border: 1px solid #f3e5ed; border-radius: 18px; background: #ffffffa8; color: #876c7b; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(285px, .85fr); gap: 20px; align-items: start; }
    .panel { border: 1px solid #f1e6ec; border-radius: 24px; background: var(--white); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .calendar-panel { padding: 22px; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .month-title { min-width: 0; }
    .month-title h2 { margin: 0; font-size: 1.35rem; }
    .month-title p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
    .nav-controls { display: flex; gap: 7px; }
    .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { margin-bottom: 7px; color: var(--muted); text-align: center; font-size: .78rem; font-weight: 750; }
    .weekdays span { padding: 8px 0; }
    .day { position: relative; display: flex; min-height: 92px; flex-direction: column; align-items: flex-start; gap: 6px; margin: 2px; padding: 9px 8px; overflow: hidden; border: 1px solid transparent; border-radius: 15px; background: transparent; text-align: left; cursor: pointer; transition: background .14s, border .14s; }
    .day:hover { background: #fff6f9; }
    .day.outside { color: #c4b8c0; }
    .day.selected { border-color: #f0b3ca; background: #fff0f5; }
    .day.today .day-number { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 10px; background: var(--pink); color: white; font-weight: 800; }
    .day-number { display: grid; width: 27px; height: 27px; place-items: center; font-size: .9rem; }
    .event-dots { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 5px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }
    .dot.lavender { background: #a799e9; }.dot.mint { background: #77b995; }.dot.yellow { background: #e7bd5d; }
    .day-event-label { max-width: 100%; overflow: hidden; color: #876c7b; font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; }
    .calendar-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .83rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; }.legend span { display: flex; align-items: center; gap: 6px; }
    .side { display: grid; gap: 16px; }
    .agenda-panel, .focus-panel { padding: 20px; }
    .panel-title { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 15px; }
    .panel-title h2 { margin: 0; font-size: 1.12rem; }
    .panel-title p { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
    .agenda-list { display: grid; gap: 9px; }
    .agenda-item { display: grid; grid-template-columns: 58px 4px minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 10px 9px; border: 1px solid #f3e9ee; border-radius: 14px; background: #fffdfd; }
    .agenda-time { color: var(--muted); font-size: .77rem; font-variant-numeric: tabular-nums; }
    .agenda-stripe { align-self: stretch; min-height: 34px; border-radius: 9px; background: var(--pink); }
    .agenda-stripe.lavender { background: #a799e9; }.agenda-stripe.mint { background: #77b995; }.agenda-stripe.yellow { background: #e7bd5d; }
    .agenda-name { min-width: 0; font-size: .88rem; font-weight: 700; overflow-wrap: anywhere; }
    .agenda-note { margin-top: 3px; color: var(--muted); font-size: .75rem; }
    .delete-event { width: 30px; height: 30px; border: 0; border-radius: 10px; background: transparent; color: #b28d9f; cursor: pointer; }
    .delete-event:hover { background: var(--pink-soft); color: #b94772; }
    .empty { padding: 21px 12px; border: 1px dashed #eadce4; border-radius: 15px; color: var(--muted); text-align: center; font-size: .87rem; line-height: 1.7; }
    .focus-panel { background: linear-gradient(145deg, #fff7da, #fffdf7 75%); }
    .focus-content { display: grid; gap: 11px; }
    .focus-row { display: flex; align-items: flex-start; gap: 9px; color: #756a58; font-size: .86rem; line-height: 1.5; }
    .focus-row input { margin-top: 3px; accent-color: var(--pink-dark); }
    .focus-row.done span { color: #a39681; text-decoration: line-through; }
    .add-focus { display: flex; gap: 7px; margin-top: 4px; }
    .add-focus input { min-width: 0; width: 100%; padding: 10px 12px; border: 1px solid #eee3d0; border-radius: 12px; outline: none; background: #fffefa; }
    .add-focus input:focus, .field input:focus, .field textarea:focus { border-color: #e9a2bc; box-shadow: 0 0 0 3px #e98fb020; }
    .focus-progress { height: 7px; overflow: hidden; border-radius: 99px; background: #efe7d4; }
    .focus-progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #efadc4, #d7a8dc); transition: width .2s; }
    .focus-caption { color: #90846e; font-size: .75rem; text-align: right; }
    dialog { width: min(460px, calc(100% - 28px)); padding: 0; border: 1px solid #f0e2e9; border-radius: 22px; background: #fffdfd; color: var(--ink); box-shadow: 0 24px 90px #53324435; }
    dialog::backdrop { background: #392b36a1; backdrop-filter: blur(3px); }
    .dialog-inner { padding: 23px; }.dialog-inner h2 { margin: 0 0 18px; font-size: 1.35rem; }
    .form-grid { display: grid; gap: 13px; }.field { display: grid; gap: 6px; }.field label { color: #786673; font-size: .83rem; font-weight: 750; }
    .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: white; }
    .field textarea { min-height: 72px; resize: vertical; }.field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--ink); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; max-width: calc(100vw - 40px); padding: 12px 17px; border: 1px solid #f0dce5; border-radius: 14px; background: white; box-shadow: var(--shadow); color: var(--ink); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; }.side { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 560px) {
      .app { width: min(100% - 24px, 520px); padding-top: 14px; }.topbar { margin-bottom: 17px; }.top-actions .button { min-height: 38px; padding: 7px 10px; font-size: .82rem; }
      .hero { align-items: flex-start; flex-direction: column; }.quote { max-width: none; width: 100%; padding: 11px 14px; }
      .calendar-panel { padding: 13px 10px; border-radius: 19px; }.calendar-head { padding: 0 4px; }.day { min-height: 70px; margin: 1px; padding: 5px 3px; border-radius: 11px; gap: 4px; }.day-number { width: 25px; height: 25px; font-size: .82rem; }.day-event-label { display: none; }.weekdays { font-size: .72rem; }
      .calendar-foot { align-items: flex-start; flex-direction: column; padding-left: 5px; }.side { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🌷</span><span>甜日誌 <span style="color:var(--pink-dark)">·</span> little day planner</span></div>
      <div class="top-actions">
        <button class="button" id="todayButton" type="button">回到今天</button>
        <button class="button" id="exportButton" type="button" title="下載日程備份">下載備份</button>
        <button class="button primary" id="addEventButton" type="button">＋ 新增日程</button>
      </div>
    </header>

    <section class="hero" aria-label="今日問候">
      <div>
        <p class="eyebrow">A LITTLE SPACE FOR YOUR DAYS</p>
        <h1>把喜歡的日子，<span style="color:var(--pink-dark)">慢慢排進生活。</span></h1>
        <p class="today-line" id="todayText"></p>
      </div>
      <div class="quote" id="dailyQuote">今天也留一點時間，給讓自己開心的小事 ☁️</div>
    </section>

    <div class="layout">
      <section class="panel calendar-panel" aria-labelledby="monthHeading">
        <div class="calendar-head">
          <div class="month-title"><h2 id="monthHeading"></h2><p>點選日期，看看那天的小計畫</p></div>
          <div class="nav-controls">
            <button class="button icon" id="prevMonth" type="button" aria-label="上一個月">‹</button>
            <button class="button icon" id="nextMonth" type="button" aria-label="下一個月">›</button>
          </div>
        </div>
        <div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="月曆"></div>
        <div class="calendar-foot">
          <div class="legend"><span><i class="dot"></i>約會/日常</span><span><i class="dot lavender"></i>工作/學習</span><span><i class="dot mint"></i>休息/照顧自己</span></div>
          <span>你的日程只儲存在這台裝置 ♡</span>
        </div>
      </section>

      <aside class="side">
        <section class="panel agenda-panel" aria-labelledby="agendaTitle">
          <div class="panel-title"><div><h2 id="agendaTitle">今日小行程</h2><p id="selectedDateText"></p></div><span aria-hidden="true">🧁</span></div>
          <div class="agenda-list" id="agendaList"></div>
        </section>
        <section class="panel focus-panel" aria-labelledby="focusTitle">
          <div class="panel-title"><div><h2 id="focusTitle">今日小目標</h2><p>完成一點點也很棒 ✨</p></div><span aria-hidden="true">🌼</span></div>
          <div class="focus-content" id="focusList"></div>
          <div class="focus-progress" aria-label="目標完成進度"><span id="progressBar"></span></div>
          <div class="focus-caption" id="progressCaption"></div>
          <form class="add-focus" id="focusForm"><input id="focusInput" type="text" maxlength="70" placeholder="新增一個小目標…" aria-label="新增小目標"><button class="button" type="submit" aria-label="加入目標">＋</button></form>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <form class="dialog-inner" id="eventForm">
      <h2 id="dialogTitle">加一筆可愛日程 ♡</h2>
      <div class="form-grid">
        <div class="field"><label for="eventTitle">要做什麼？</label><input id="eventTitle" name="title" type="text" maxlength="60" placeholder="例如：和朋友喝下午茶" required></div>
        <div class="field"><label for="eventDate">日期</label><input id="eventDate" name="date" type="date" required></div>
        <div class="field"><label for="eventTime">時間（可不填）</label><input id="eventTime" name="time" type="time"></div>
        <div class="field"><label for="eventCategory">分類</label><select id="eventCategory" name="category"><option value="pink">約會／日常</option><option value="lavender">工作／學習</option><option value="mint">休息／照顧自己</option><option value="yellow">其他小事</option></select></div>
        <div class="field"><label for="eventNote">備註（可不填）</label><textarea id="eventNote" name="note" maxlength="120" placeholder="地點、提醒或想記住的事…"></textarea></div>
      </div>
      <div class="dialog-actions"><button class="button" id="cancelDialog" type="button">先不要</button><button class="button primary" type="submit">存下日程</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'sweet-days-calendar-v1';
      const GOALS_KEY = 'sweet-days-goals-v1';
      const today = new Date();
      const localISO = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      const parseLocal = (value) => { const [y,m,d] = value.split('-').map(Number); return new Date(y,m-1,d,12); };
      const dateFmt = new Intl.DateTimeFormat('zh-TW', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
      const monthFmt = new Intl.DateTimeFormat('zh-TW', {year:'numeric',month:'long'});
      const escapeHTML = (value) => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const readArray = (key) => { try { const value = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(value) ? value : []; } catch { return []; } };
      let events = readArray(STORAGE_KEY).filter(e => e && typeof e.id === 'string' && typeof e.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
      let goals = readArray(GOALS_KEY).filter(g => g && typeof g.id === 'string' && typeof g.text === 'string');
      let shownMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      let selectedDate = localISO(today);
      const grid = document.getElementById('calendarGrid');
      const agenda = document.getElementById('agendaList');
      const toast = document.getElementById('toast');
      let toastTimer;
      const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); } catch { notify('瀏覽器儲存空間無法使用，請檢查設定。'); } };
      function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2500); }
      function renderCalendar() {
        document.getElementById('monthHeading').textContent = monthFmt.format(shownMonth);
        const y = shownMonth.getFullYear(), m = shownMonth.getMonth();
        const first = new Date(y,m,1).getDay();
        const start = new Date(y,m,1-first);
        grid.innerHTML = '';
        for (let i=0;i<42;i++) {
          const date = new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
          const key = localISO(date);
          const dayEvents = events.filter(e => e.date === key).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'day';
          if (date.getMonth() !== m) button.classList.add('outside');
          if (key === localISO(today)) button.classList.add('today');
          if (key === selectedDate) button.classList.add('selected');
          button.setAttribute('role','gridcell'); button.setAttribute('aria-pressed',String(key === selectedDate));
          button.setAttribute('aria-label', `${dateFmt.format(date)}${dayEvents.length ? `，${dayEvents.length} 個日程` : ''}`);
          const num = document.createElement('span'); num.className='day-number'; num.textContent=String(date.getDate()); button.appendChild(num);
          if (dayEvents.length) {
            const dots = document.createElement('span'); dots.className='event-dots'; dots.setAttribute('aria-hidden','true');
            dayEvents.slice(0,4).forEach(e => { const dot=document.createElement('i'); dot.className=`dot ${['lavender','mint','yellow'].includes(e.category)?e.category:''}`; dots.appendChild(dot); });
            button.appendChild(dots);
            if (dayEvents[0].title) { const label=document.createElement('span'); label.className='day-event-label'; label.textContent=dayEvents[0].title; button.appendChild(label); }
          }
          button.addEventListener('click', () => { selectedDate=key; if(date.getMonth()!==shownMonth.getMonth()) shownMonth=new Date(date.getFullYear(),date.getMonth(),1); render(); });
          grid.appendChild(button);
        }
      }
      function renderAgenda() {
        const date = parseLocal(selectedDate);
        document.getElementById('selectedDateText').textContent = dateFmt.format(date);
        document.getElementById('agendaTitle').textContent = selectedDate===localISO(today) ? '今日小行程' : '這天的小行程';
        const items=events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
        agenda.innerHTML='';
        if (!items.length) { agenda.innerHTML='<div class="empty">這天還沒有安排呢。<br>留白也很美，或新增一件小期待 ♡</div>'; return; }
        for(const e of items) {
          const row=document.createElement('article'); row.className='agenda-item';
          const time=document.createElement('time'); time.className='agenda-time'; time.textContent=e.time || '全天';
          const stripe=document.createElement('span'); stripe.className=`agenda-stripe ${['lavender','mint','yellow'].includes(e.category)?e.category:''}`;
          const body=document.createElement('div'); body.innerHTML=`<div class="agenda-name">${escapeHTML(e.title)}</div>${e.note?`<div class="agenda-note">${escapeHTML(e.note)}</div>`:''}`;
          const del=document.createElement('button'); del.className='delete-event'; del.type='button'; del.textContent='×'; del.setAttribute('aria-label',`刪除日程：${e.title}`);
          del.addEventListener('click',()=>{events=events.filter(x=>x.id!==e.id);save();render();notify('已刪除這筆日程');});
          row.append(time,stripe,body,del); agenda.appendChild(row);
        }
      }
      function renderGoals() {
        const list=document.getElementById('focusList'); list.innerHTML='';
        if(!goals.length) list.innerHTML='<div class="empty">還沒有小目標，寫下一件今天想完成的事吧 ♡</div>';
        goals.forEach(goal=>{
          const label=document.createElement('label'); label.className=`focus-row${goal.done?' done':''}`;
          const check=document.createElement('input'); check.type='checkbox'; check.checked=!!goal.done; check.setAttribute('aria-label',`完成：${goal.text}`);
          check.addEventListener('change',()=>{goal.done=check.checked;save();renderGoals();});
          const text=document.createElement('span'); text.textContent=goal.text; label.append(check,text); list.appendChild(label);
        });
        const done=goals.filter(g=>g.done).length, percent=goals.length?done/goals.length*100:0;
        document.getElementById('progressBar').style.width=`${percent}%`;
        document.getElementById('progressCaption').textContent=goals.length?`已完成 ${done} / ${goals.length} 件小事`:'從一個小目標開始，今天就很棒';
      }
      function render(){renderCalendar();renderAgenda();renderGoals();}
      document.getElementById('prevMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);renderCalendar();});
      document.getElementById('nextMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);renderCalendar();});
      document.getElementById('todayButton').addEventListener('click',()=>{shownMonth=new Date(today.getFullYear(),today.getMonth(),1);selectedDate=localISO(today);render();});
      const dialog=document.getElementById('eventDialog'), form=document.getElementById('eventForm');
      document.getElementById('addEventButton').addEventListener('click',()=>{form.reset();document.getElementById('eventDate').value=selectedDate;dialog.showModal();document.getElementById('eventTitle').focus();});
      document.getElementById('cancelDialog').addEventListener('click',()=>dialog.close());
      dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
      form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form);const title=String(data.get('title')||'').trim();const date=String(data.get('date')||'');if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(date)){notify('請填寫日程名稱和有效日期');return;}events.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,title,date,time:String(data.get('time')||''),category:String(data.get('category')||'pink'),note:String(data.get('note')||'').trim()});selectedDate=date;const parsed=parseLocal(date);shownMonth=new Date(parsed.getFullYear(),parsed.getMonth(),1);save();dialog.close();render();notify('新日程已甜甜存好 ♡');});
      document.getElementById('focusForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('focusInput');const text=input.value.trim();if(!text)return;goals.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,text,done:false});input.value='';save();renderGoals();notify('已加入今日小目標 ✨');});
      document.getElementById('exportButton').addEventListener('click',()=>{const payload={exportedAt:new Date().toISOString(),events,goals};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`甜日誌備份-${localISO(today)}.json`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);notify('日程備份已下載');});
      const quotes=['今天也留一點時間，給讓自己開心的小事 ☁️','不用趕路，慢慢來也會到達喜歡的地方 🌷','記得喝水，也記得稱讚努力生活的自己 ✨','今天的你，值得一個剛剛好的小休息 🍵','把日子過成喜歡的樣子，一點一點就好 ♡'];
      const dayOfYear=Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate())-new Date(today.getFullYear(),0,0))/86400000);
      document.getElementById('dailyQuote').textContent=quotes[dayOfYear%quotes.length];
      document.getElementById('todayText').textContent=`今天是 ${dateFmt.format(today)}，願你有個柔軟又可愛的一天。`;
      render();
    })();
  </script>
</body>
</html>
